bridge:
  name: "bridge-windows"
  log_level: "INFO"

cache:
  enabled: true

security:
  # 600/分钟与部署端一致，也是热集行情轮转的设计预算（`tdx_hot_set_feed` 默认
  # 0.18s/只 ≈ 333/min，与持仓馈送/账户同步/推送共用同一配额）。旧默认 60 会让
  # 自带配置起桥的部署立刻自锁（热集一轮就打满），实测 429 刷屏。
  rate_limit_per_minute: 600          # 未鉴权请求/IP/分钟（防爆破）
  authed_rate_limit_per_minute: 6000  # 已鉴权请求/IP/分钟（平台与管理端常共用出口 IP）
  write_rate_limit: 10
  fail_ban_threshold: 5
  fail_ban_seconds: 30

ui:
  auto_open: true

auth:
  token: "${BRIDGE_AUTH_TOKEN}"
  # 额外 token (逗号分隔, 支持多客户端访问)
  extra_tokens: ""

channels:
  mode: "auto"
  http:
    enabled: true
    host: "0.0.0.0"
    port: 8550
    timeout_seconds: 30
  file_sync:
    enabled: true
    # 与 Linux 共享同一目录 (Windows 侧为 SMB 挂载或映射盘)
    shared_dir: "${SHARED_DIR}"

failover:
  primary_channel: "http"
  fallback_channel: "file_sync"
  http_max_retries: 3
  http_retry_delay_ms: 1000
  health_check_interval_seconds: 10
  auto_recover_http: true

tdx:
  base_url: "http://127.0.0.1:17709/"
  request_timeout_seconds: 8
  max_retries: 0

sltp_daemon:
  enabled: true
  poll_interval_seconds: 5
  state_file: "./data/stop_loss_state.json"

trade:
  # 下单确认：0=需在通达信客户端手动确认（默认，安全）；1=请求免确认。
  # 官方文档：实盘账户默认弹确认；免确认需券商开通「支持TQ的版本」。
  notify: 0

# QMT 写入闸（默认关）。即使打开，伴生桥 source_http.allow_orders 与
# QMT 策略 ALLOW_ORDER_METHODS 也必须同时打开，三道闸缺一不可。
qmt_orders:
  enabled: false

order_tracking:
  state_file: "./data/active_orders.json"
  sync_interval_seconds: 15

# 通达信独立数据接口（tdxaidata / tqs）：不依赖 TdxW，需商城付费 Key。
# Key 在网页控制台「数据服务」里填，写入 <vendor>/tdxaidata/lib/TdxAiData.ini。
aidata:
  enabled: true
  vendor_dir: "./vendor"
  ini_path: ""            # 空 = <vendor>/tdxaidata/lib/TdxAiData.ini
  max_rows_per_call: 0    # 安全阀：单次返回行数上限，0=不限（按次计费，行数不额外收费）
  rows_per_token: 200     # 实测：每 200 条返回数据 = 1 词元（向上取整，最低 1）
  min_tokens_per_call: 1
  daily_token_budget: 500 # 每日词元硬预算（0=不限）；超预算的调用直接 429 拒绝
  max_symbols: 100        # 通达信 SDK 单次订阅硬上限（累计并集）

# 实时订阅：tq = 免费（客户端通知，桥再拉快照）；aidata = 付费（完整盘口推送）。
# 订阅列表在网页控制台「实时订阅」里维护：免费通道 ≤100，付费通道 ≤max_symbols_aidata。
subscription:
  enabled: false
  mode: "tq"
  state_file: "./data/subscription.json"
  tq_sys_path: ""         # 空 = <bridge 父目录>/sys（通达信 PYPlugins\sys）
  max_symbols_tq: 100     # 免费通道硬上限（tqcenter.subscribe_hq 源码写死）
  max_symbols_aidata: 500 # 付费通道（tdxaidata 的 Python 层无 100 检查；真实上限以服务端为准）
  allow_paid_pushes: false # 付费推送按条计费（≈9000 词元/小时），默认硬禁

# 同花顺旁路（只读；独立 worker 进程，默认关闭）。开启后 /api/v1/ths/* 才可用。
ths:
  enabled: false
  base_url: "http://127.0.0.1:8765"
  timeout_s: 8
  cache_enabled: true
  circuit_failures: 5
  circuit_cooldown_s: 30
  max_concurrency: 4      # 桥→worker 出站并发上限（worker MAIN 连接串行，超了只会堆队列）
  gate_wait_s: 0.3        # 闸门满时最多等 0.3s，再满就快速 503（有 TDX 兜底）
  circuit_timeout_failures: 10  # 超时单独计权：连续超时 10 次才熔断（传输错误 5 次）

