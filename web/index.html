    <style>
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Inter, "Noto Sans SC", "Source Han Sans SC", "思源黑体", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #f5576c 75%, #4facfe 100%);
        background-size: 400% 400%;
        animation: qmGradientShift 15s ease infinite;
      }

      /* React 挂载后由 main.tsx 给 body 加上 .qm-loaded，让底部 Dock 区域承接页面底色
         （与 .app-main 渐变末端 #e2e8f0 保持一致，避免浏览器视口白色从透明层透出） */
      body.qm-loaded {
        background: #e2e8f0;
        animation: none;
      }

      .qm-boot {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
      }

      .qm-boot-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(255, 255, 255, 0.28);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: qmSpin 1s linear infinite;
      }

      @keyframes qmSpin {
        to { transform: rotate(360deg); }
      }

      @keyframes qmGradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
    </style>
