user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # .mjs ES Module：PDF.js worker 等前端库必需，否则浏览器以 octet-stream 拒绝执行 worker
    types {
        application/javascript mjs;
    }
    resolver 127.0.0.11 valid=10s ipv6=off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /health {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"healthy","service":"quantmind-web"}\n';
        }

        location /api/ {
            # 用变量形式触发 nginx 在每次请求时通过 docker resolver (127.0.0.11) 重新解析
            # 这样 quantmind 容器重启后 IP 变更，nginx 不会一直缓存旧 IP 导致 502.
            # 详见 https://www.nginx.com/blog/dns-service-discovery-nginx-plus/
            set $upstream_api "quantmind:8000";
            proxy_pass http://$upstream_api;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Internal-Call "";
            proxy_set_header X-User-Id "";
            proxy_set_header X-Tenant-Id "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        location /ws/ {
            # 用变量形式触发 nginx 在每次请求时通过 docker resolver (127.0.0.11) 重新解析
            # 这样 quantmind 容器重启后 IP 变更，nginx 不会一直缓存旧 IP 导致 502.
            # 详见 https://www.nginx.com/blog/dns-service-discovery-nginx-plus/
            # WebSocket 由 stream 服务(8003) 处理；rewrite 剥离 /ws/ 前缀后转发
            set $upstream_ws "quantmind:8003";
            rewrite ^/ws/(.*)$ /$1 break;
            proxy_pass http://$upstream_ws;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Internal-Call "";
            proxy_set_header X-User-Id "";
            proxy_set_header X-Tenant-Id "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        location ~* ^(?!/api/)(?!/ws/).*\.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|map)$ {
            try_files $uri =404;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
            # index.html 禁止任何缓存：no-store 确保每次请求都回源拿最新的 html，
            # 避免浏览器强刷仍命中旧 html（旧 html 引用已被清理的旧 chunk → 404 → 白屏报错）。
            # 资源文件（js/css）文件名带内容 hash + immutable，可长缓存，不受 no-store 影响
            add_header Cache-Control "no-store, max-age=0";
        }
    }
}
