# QuantBot（dsh）容器前门：对外 0.0.0.0:8088 → 容器内 dsh 127.0.0.1:3081
#
# 职责（对齐 baymax 生产代理逐条实测）：
#   ① dsh 官方硬拒绑 0.0.0.0（防 RCE 外露）——对外暴露由本 nginx 承担；
#   ② 注入 dsh 浏览器鉴权 cookie（$dsh_auth_cookie 由 dsh-cookies.conf 的 map 生成，
#      entrypoint 每次启动重签）——QuantBot 页面是无 token 的 iframe，靠它进门；
#   ③ Host 用 $http_host 透传（$host 会丢端口，dsh 的 trusted-host 围栏按 host:port
#      精确匹配，丢端口会导致 /api 403）；
#   ④ SSE/WebSocket 透传（dsh UI 实时流）：proxy_buffering off + 长超时 + Upgrade 头；
#   ⑤ 注入 crypto.randomUUID polyfill（局域网 HTTP 非安全上下文下 dsh UI 必需）。
server {
    listen 8088;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:3081;
        proxy_set_header Host $http_host;
        # 注入 dsh 的浏览器鉴权 cookie（dsh 只认 dsh-auth-* 一个 cookie，替换安全）；
        # 重新签发见 mint_cookies.py（重启容器自动重签）。
        proxy_set_header Cookie $dsh_auth_cookie;
        # 禁掉上游压缩：sub_filter 只能在明文响应上替换（否则注入不了 polyfill）
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE / WebSocket 支持（dsh UI 实时流）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;

        # crypto.randomUUID 只在 secure context（HTTPS/localhost）可用；
        # 局域网 HTTP 访问时 undefined → dsh 工作区/提供方目录加载失败。
        # 在 </head> 前注入 UUID v4 polyfill（crypto.getRandomValues 非 secure context 可用）。
        #
        # __DSH_TRUSTED_LOOPBACK__：dsh 预览版只在 loopback 页面启用设置持久化，
        # 非 loopback 时模型提供方 / MCP 连接器等设置页报 "settings are unavailable
        # in this browser"。本前门对页面统一注入该标志 + 镜像内客户端补丁
        # （docker/dsh/patch-settings-loopback.mjs）→ 经前门访问的浏览器与 localhost 同权。
        # 安全边界仍是 dsh 服务端 /api browser-trust 围栏（DSH_TRUSTED_HOSTS）：
        # 非可信 Host 的 /api 一律 403，该标志给不了他们额外能力。
        sub_filter '</head>' "<script>globalThis.__DSH_TRUSTED_LOOPBACK__=true;if(!globalThis.crypto||!globalThis.crypto.randomUUID){var c=globalThis.crypto||(globalThis.crypto={});c.randomUUID=function(){var a=new Uint8Array(16);if(typeof crypto.getRandomValues==='function'){crypto.getRandomValues(a)}else{for(var i=0;i<16;i++)a[i]=Math.floor(Math.random()*256)}a[6]=a[6]&15|64;a[8]=a[8]&63|128;return Array.prototype.map.call(a,function(v,i){return(i===4||i===6||i===8||i===10?'-':'')+(v<16?'0':'')+v.toString(16)}).join('')}}</script></head>";
        sub_filter_once on;
    }
}
