#   A = 中国证券登记结算（南向结算席；A00005 为中国结算香港，单列）
#   B = 券商（本地/中资/外资/零售）
#   C = 银行/托管行
# 这张表是因子研究的**唯一分类口径**；改分类必须同时改版本号并记录。
# explicit id 优先于 token，token 按 categories 顺序匹配，最后按前缀兜底：
#   B -> local_small_broker, C -> local_custodian, A -> other。
